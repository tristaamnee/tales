# Tự tách nền ảnh thành viên: push ảnh vào photos/ là xong,
# workflow sẽ tạo public/images/members/<id>.webp rồi tự commit lại vào branch.
name: Tách nền ảnh thành viên

on:
  push:
    paths:
      - "photos/**"
      - "tools/process_photos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      REMBG_HOME: ${{ github.workspace }}/.rembg-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Cache model tách nền (~1GB)
        uses: actions/cache@v4
        with:
          path: .rembg-cache
          key: rembg-models-${{ hashFiles('tools/requirements.txt') }}

      - run: pip install -r tools/requirements.txt

      - name: Tách nền
        run: python tools/process_photos.py

      - name: Commit ảnh đã xử lý
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/members
          if git diff --cached --quiet; then
            echo "Không có ảnh mới."
          else
            git commit -m "Tách nền ảnh thành viên"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
