# Kiểm tra content/*.json mỗi khi có thay đổi, báo lỗi rõ ràng trước khi lên web.
name: Kiểm tra nội dung

on:
  push:
    paths:
      - "content/**"
      - "photos/**"
      - "tools/validate_content.py"
  pull_request:
    paths:
      - "content/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18,<5"
      - run: python tools/validate_content.py
